# Run the unit test suites for every push and submitted pull request,
# covering both the root project and the testmod.

name: test_mod
on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run tests
        run: ./gradlew test :testmod:test
      - name: capture test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            testmod/build/reports/tests/
